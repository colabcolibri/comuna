# Snippet para o file provider do Traefik (network_mode: host).
# Substituir COMUNA_HOST / COMUNA_OPS_HOST. Não misturar com outros
# routers já no dynamic_conf do servidor (fundir à mão).
# Confirmar entryPoints e certResolver no traefik.yml da máquina.

http:
  routers:
    comuna-web:
      rule: Host(`COMUNA_HOST`)
      entryPoints:
        - websecure
      service: comuna-web
      tls:
        certResolver: letsencrypt
    comuna-admin:
      rule: Host(`COMUNA_OPS_HOST`)
      entryPoints:
        - websecure
      service: comuna-admin
      tls:
        certResolver: letsencrypt
  services:
    comuna-web:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:3014
    comuna-admin:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:3015
