# Drop-in para o Traefik em /opt/nanoclaw-stack/traefik (network_mode: host).
# Não substitui o bloco do uai em dynamic_conf.yml — o ficheiro no VPS
# é a união (ver dynamic_conf.merged.yml).

http:
  routers:
    comuna-web:
      rule: Host(`comuna.sergioluciano.com`)
      entryPoints:
        - websecure
      service: comuna-web
      tls:
        certResolver: letsencrypt
    comuna-admin:
      rule: Host(`ops.comuna.sergioluciano.com`)
      entryPoints:
        - websecure
      service: comuna-admin
      tls:
        certResolver: letsencrypt
  services:
    comuna-web:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:3014
    comuna-admin:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:3015
