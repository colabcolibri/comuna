# VPS nova (Ubuntu + Docker). Não substitui o docker-compose.yml local
# (Postgres 5433 + Mailpit).
#
# Caddy publica 80/443 e termina TLS. Web e admin ficam só na rede
# interna. Postgres não publica porta. Sem Mailpit.
#
# Runbook: deploy/hostinger/README.md (primeira vez + deploy de rotina).
# SSH/alias de prod: deploy/hostinger/MAINTAINER.local.md (gitignored).

name: comuna

services:
  postgres:
    image: postgres:18-alpine
    container_name: comuna_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: comuna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: alumni_db
    volumes:
      - comuna_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comuna -d alumni_db']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - comuna_internal

  migrate:
    build:
      context: .
      dockerfile: deploy/hostinger/Dockerfile.migrate
    container_name: comuna_migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://comuna:${POSTGRES_PASSWORD}@postgres:5432/alumni_db
      PGSSL: '0'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comuna_internal

  seed:
    profiles: ['seed']
    build:
      context: .
      dockerfile: deploy/hostinger/Dockerfile.migrate
    container_name: comuna_seed
    restart: 'no'
    command: ['node', 'scripts/db/seed.cjs']
    environment:
      DATABASE_URL: postgresql://comuna:${POSTGRES_PASSWORD}@postgres:5432/alumni_db
      PGSSL: '0'
      INITIAL_SUPER_ADMIN_EMAIL: ${INITIAL_SUPER_ADMIN_EMAIL:-admin@example.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comuna_internal

  web:
    build:
      context: .
      dockerfile: deploy/hostinger/Dockerfile.web
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_OPS_URL: ${NEXT_PUBLIC_OPS_URL}
    container_name: comuna_web
    restart: unless-stopped
    environment:
      PORT: '3014'
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgresql://comuna:${POSTGRES_PASSWORD}@postgres:5432/alumni_db
      PGSSL: '0'
      JWT_SECRET: ${JWT_SECRET}
      INITIAL_SUPER_ADMIN_EMAIL: ${INITIAL_SUPER_ADMIN_EMAIL:-admin@example.com}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_OPS_URL: ${NEXT_PUBLIC_OPS_URL}
      MEDIA_DRIVER: local
      MEDIA_ROOT: /data/storage
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALLOW_DEV_OTP: ${ALLOW_DEV_OTP:-}
      DATABASE_READ_ONLY: ${DATABASE_READ_ONLY:-}
    volumes:
      - comuna_media:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3014/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - comuna_internal

  admin:
    build:
      context: .
      dockerfile: deploy/hostinger/Dockerfile.admin
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_OPS_URL: ${NEXT_PUBLIC_OPS_URL}
    container_name: comuna_admin
    restart: unless-stopped
    environment:
      PORT: '3015'
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgresql://comuna:${POSTGRES_PASSWORD}@postgres:5432/alumni_db
      PGSSL: '0'
      JWT_SECRET: ${JWT_SECRET}
      INITIAL_SUPER_ADMIN_EMAIL: ${INITIAL_SUPER_ADMIN_EMAIL:-admin@example.com}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_OPS_URL: ${NEXT_PUBLIC_OPS_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALLOW_DEV_OTP: ${ALLOW_DEV_OTP:-}
      DATABASE_READ_ONLY: ${DATABASE_READ_ONLY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - comuna_internal

  caddy:
    image: caddy:2-alpine
    container_name: comuna_caddy
    restart: unless-stopped
    environment:
      COMUNA_HOST: ${COMUNA_HOST}
      COMUNA_OPS_HOST: ${COMUNA_OPS_HOST}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/hostinger/Caddyfile:/etc/caddy/Caddyfile:ro
      - comuna_caddy_data:/data
      - comuna_caddy_config:/config
    depends_on:
      - web
      - admin
    networks:
      - comuna_internal

networks:
  comuna_internal:
    name: comuna_internal
    driver: bridge

volumes:
  comuna_pgdata:
  comuna_media:
  comuna_caddy_data:
  comuna_caddy_config:
